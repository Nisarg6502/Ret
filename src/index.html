<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120c08">
<meta name="description" content="Ret: an endless desert world generated and simulated from physics, in one small file.">
<title>Ret</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#f4e9dc;--dim:rgba(244,233,220,.62);--glass:rgba(20,13,8,.38);--line:rgba(244,233,220,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120c08;overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 30%,rgba(10,6,3,.55) 100%);transition:opacity 1.2s ease}
#intro.out{opacity:0;pointer-events:none}
#intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,13vw,132px);letter-spacing:.42em;margin-right:-.42em;line-height:1;text-shadow:0 2px 30px rgba(40,20,5,.5)}
#intro p{font-family:var(--serif);font-style:italic;font-size:clamp(16px,2.6vw,21px);color:var(--dim);max-width:30em}
#go{margin-top:14px;font:500 14px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--ink);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:15px 34px 15px 38px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#go:hover{background:rgba(40,26,16,.55)}
#go:disabled{opacity:.5;cursor:default}
#intro small{font-size:12px;color:var(--dim);letter-spacing:.06em;min-height:1em}
#hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;font:500 12px/1.4 var(--sans);letter-spacing:.08em;color:var(--dim);text-shadow:0 1px 6px rgba(0,0,0,.45);transition:opacity .6s}
#hud b{color:var(--ink);font-weight:500}
#compass{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(320px,52vw);height:22px;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
#compass div{position:absolute;top:0;white-space:nowrap;font:600 11px/22px var(--sans);letter-spacing:.1em;color:var(--ink);text-shadow:0 1px 5px rgba(0,0,0,.5)}
#compass:after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:5px;background:var(--ink)}
#hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font:500 12px/1.6 var(--sans);letter-spacing:.06em;color:var(--dim);
  text-align:center;pointer-events:none;transition:opacity 1.5s;text-shadow:0 1px 6px rgba(0,0,0,.5);width:92vw}
#touch{position:fixed;inset:0;touch-action:none}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--line);background:rgba(20,13,8,.18);pointer-events:none;opacity:0;transition:opacity .2s}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(244,233,220,.32)}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:flex-end}
#btns button,#menuB{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 11px/1 var(--sans);letter-spacing:.06em;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
#btns button.on{background:rgba(244,233,220,.3)}
#btns .big{width:68px;height:68px}
#fps{position:fixed;right:10px;bottom:6px;font:11px/1 ui-monospace,monospace;color:var(--dim);pointer-events:none}
#err{position:fixed;inset:auto 16px 16px;padding:14px 16px;background:rgba(60,10,5,.85);border-radius:10px;font:13px/1.5 var(--sans)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch" class="hide">
  <div id="stick"><i></i></div>
  <div id="btns">
    <button id="bTilt">TILT</button>
    <button id="bFly">FLY</button>
    <button id="bTime">TIME</button>
    <button id="bJump" class="big">JUMP</button>
  </div>
</div>
<div id="hud" class="hide"><span id="clock"></span><span id="wind"></span></div>
<div id="compass" class="hide"><div id="cstrip"></div></div>
<div id="hint" class="hide"></div>
<div id="intro">
  <h1>RET</h1>
  <p>An endless desert, generated and simulated from physics.</p>
  <button id="go" disabled>Enter</button>
  <small id="status">Shaping dunes</small>
</div>
<div id="fps" class="hide"></div>
<div id="err" class="hide"></div>
<!--JS-->
</body>
</html>
